[project]
name = "digis-test-task"
version = "0.1.0"
description = "Invoice-to-accounting sync integration service"
authors = [
    {name = "sen9a",email = "sen9a1990@gmail.com"}
]
requires-python = ">=3.13"
dependencies = [
    "pydantic (>=2.13.4,<3.0.0)",
    "aiohttp (>=3.14.3,<4.0.0)",
    "tenacity (>=9.1.4,<10.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "sqlalchemy[asyncio] (>=2.0.52,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.19.1,<2.0.0)",
]

[project.optional-dependencies]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "src"}]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests that require running Docker services",
]
